name: Build SubHub AAB (Play Store)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Automatically Fix Package Name & Upgrade to API 35
        run: |
          # Canza applicationId zuwa ng.com.subhub
          find . -name "build.gradle" -o -name "build.gradle.kts" | xargs sed -i 's/applicationId .*/applicationId "ng.com.subhub"/g' || true
          
          # Tilasta wa targetSdkVersion da compileSdkVersion su koma 35 na dokar Google Play
          find . -name "build.gradle" -o -name "build.gradle.kts" | xargs sed -i 's/targetSdkVersion .*/targetSdkVersion 35/g' || true
          find . -name "build.gradle" -o -name "build.gradle.kts" | xargs sed -i 's/targetSdk .*/targetSdk = 35/g' || true
          find . -name "build.gradle" -o -name "build.gradle.kts" | xargs sed -i 's/compileSdkVersion .*/compileSdkVersion 35/g' || true
          find . -name "build.gradle" -o -name "compileSdk .*/compileSdk = 35/g' || true

      - name: Build Release AAB
        run: ./gradlew bundleRelease

      - name: Sign App Bundle
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: SubHub-Signed-AAB
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
