name: Build SubHub AAB (Play Store)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Force Upgrade to API 35, Version 2, and Package Name (Python Script)
        run: |
          python3 -c "
          import os, re
          
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if file in ['build.gradle', 'build.gradle.kts']:
                      file_path = os.path.join(root, file)
                      with open(file_path, 'r') as f:
                          content = f.read()
                      
                      # Force Upgrade API Levels to 35
                      content = re.sub(r'(targetSdkVersion\s*=?\s*)\d+', r'\g<1>35', content)
                      content = re.sub(r'(targetSdk\s*=?\s*)\d+', r'\g<1>35', content)
                      content = re.sub(r'(compileSdkVersion\s*=?\s*)\d+', r'\g<1>35', content)
                      content = re.sub(r'(compileSdk\s*=?\s*)\d+', r'\g<1>35', content)
                      
                      # Force Upgrade Version Code to 2
                      content = re.sub(r'(versionCode\s*=?\s*)\d+', r'\g<1>2', content)
                      
                      # Force Update Application ID to ng.com.subhub
                      content = re.sub(r'(applicationId\s*=?\s*[\"\']).*?([\"\'])', r'\g<1>ng.com.subhub\g<2>', content)
                      
                      with open(file_path, 'w') as f:
                          f.write(content)
                      print(f'Successfully updated: {file_path}')
          "

      - name: Build Release AAB
        run: ./gradlew bundleRelease

      - name: Sign App Bundle
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: SubHub-Signed-AAB
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
